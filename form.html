<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report an Issue - CivicTracker</title>
<style>
  /* Shared design system rules from frontend_specifications.md */
  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
  }

  /* Narrower container just for this form page */
  .container {
    width: 600px;
    margin: 0 auto;
  }

  .header {
    background-color: #ffffff;
    padding: 15px 0;
    text-align: center;
    border-bottom: 1px solid #ddd;
  }

  .back-link {
    float: left;
    margin-left: 20px;
    text-decoration: none;
    color: #333333;
    font-weight: bold;
  }

  .card {
    background-color: #ffffff;
    padding: 20px;
    margin-top: 20px;
    border-radius: 6px;
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  input[type="text"] {
    width: 95%;
    padding: 8px;
    margin-bottom: 15px;
    border: 1px solid #cccccc;
    border-radius: 4px;
  }

  input[type="file"] {
    margin-bottom: 20px;
  }

  .submit-btn {
    display: block;
    width: 200px;
    margin: 0 auto;
    padding: 12px;
    text-align: center;
    background-color: #1976d2;
    color: #ffffff;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <!-- Header with back button -->
  <div class="header">
    <a href="category.html" class="back-link">&lt; Back</a>
    Report an Issue
  </div>

  <div class="container">
    <div class="card">
      <form>
        <!-- Road Name input -->
        <label for="road-name">Road Name</label>
        <input type="text" id="road-name" name="road-name" placeholder="Enter">

        <!-- Sector input -->
        <label for="sector">Sector</label>
        <input type="text" id="sector" name="sector" placeholder="Enter">

        <!-- City input -->
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="Enter">

        <!-- State input -->
        <label for="state">State</label>
        <input type="text" id="state" name="state" placeholder="Enter">

        <!-- Pin Code input -->
        <label for="pin-code">Pin Code</label>
        <input type="text" id="pin-code" name="pin-code" placeholder="Enter">

        <!-- File input for photos -->
        <label for="photos">Add some photos</label>
        <input type="file" id="photos" name="photos">
      </form>

      <!-- Submit "button" as a link since there's no backend -->
      <a href="submitted.html" class="submit-btn">Submit</a>
    </div>
  </div>

</body>
</html>
